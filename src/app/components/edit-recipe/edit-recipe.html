<div class="form-wrapper">
  <form class="styled-form" (ngSubmit)="onSubmit()">

    <h2>Edit Recipe</h2>

    <!-- Name -->
    <div class="form-group">
      <label>Recipe Name</label>
      <input type="text" [(ngModel)]="name" name="name">
    </div>

    <!-- Category -->
    <div class="form-group">
      <label>Category</label>
      <input type="text" [(ngModel)]="category" name="category">
    </div>

    <!-- Prep Time -->
    <div class="form-group">
      <label>Preparation Time</label>
      <input type="number" [(ngModel)]="prep_time" name="prep_time">
    </div>

    <!-- IMAGE FIELD  -->
    <div class="form-group">
      <label>Image URL</label>
      <input
        type="text"
        [(ngModel)]="image"
        name="image"
        placeholder="Paste image URL">
    </div>

    <div class="nutrition-grid">
  <div class="form-group">
    <label>Calories</label>
    <input type="number" [(ngModel)]="calories" name="calories">
  </div>

  <div class="form-group">
    <label>Protein (g)</label>
    <input type="number" [(ngModel)]="protein" name="protein">
  </div>

  <div class="form-group">
    <label>Carbs (g)</label>
    <input type="number" [(ngModel)]="carbs" name="carbs">
  </div>

  <div class="form-group">
    <label>Servings</label>
    <input type="number" [(ngModel)]="servings" name="servings">
  </div>
</div>








    <!-- Instructions -->
    <div class="form-group">
      <label>Instructions</label>
      <textarea [(ngModel)]="steps" name="steps"></textarea>
    </div>

    <button type="submit">Update Recipe</button>

    <p class="message">{{ message }}</p>

  </form>
</div>
